name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This job compiles and lints the daemon without the Flutter SDK and never
    # serves the embedded client, so opt out of triaged's missing-SDK hard error
    # (build.rs). Scoped to this job, not the workflow: a job that *does* need the
    # real client must not silently inherit the placeholder. Release packaging is
    # unaffected — it stages a prebuilt bundle into dist/, which build.rs prefers.
    env:
      TRIAGE_SKIP_FLUTTER_BUILD: "1"

    steps:
      - name: Checkout
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Check version consistency
        run: ./scripts/bump-version.sh --check

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: nightly-2026-07-10
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@v2
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false

      - name: Install flatc
        uses: ./.github/actions/setup-flatc

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check documentation
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Compiles and runs the daemon's tests without the Flutter SDK and never
    # serves the embedded client, so opt out of the missing-SDK hard error.
    # Scoped to this job (see the check job) rather than the whole workflow.
    env:
      TRIAGE_SKIP_FLUTTER_BUILD: "1"

    steps:
      - name: Checkout
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@v1
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: nightly-2026-07-10

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache@v2
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          cache-bin: false

      - name: Install flatc
        uses: ./.github/actions/setup-flatc

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  flutter:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flutter/triage_client

    steps:
      - name: Checkout
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up Flutter
        # subosito/flutter-action@v2 (matches publish.yml)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install flatc
        # Version comes from the action's own default, which the drift check
        # below reads too — the checked-in bindings are only byte-comparable
        # against one flatc release, so both sides must name the same one.
        uses: ./.github/actions/setup-flatc

      # The Rust bindings regenerate from the schema via triage-core's build.rs,
      # but the Dart ones are checked in with no such trigger. That asymmetry let
      # them go stale once already: `list_session_contexts` was missing from the
      # Dart bindings entirely, which would have thrown UnimplementedError on any
      # flatbuffers-negotiated connection. It went unnoticed because the client
      # offered only `triage-json` at the time, so nothing negotiated the binary
      # format — the bug sat latent until the default was flipped. Fail the build
      # rather than rely on someone noticing.
      - name: Check Dart FlatBuffers bindings are current
        working-directory: .
        run: scripts/generate-dart-flatbuffers.sh --check

      # The generated FlatBuffers bindings are excluded from analysis (see
      # analysis_options.yaml); what remains is a small backlog of genuine
      # findings in hand-written code. Still gated on error-severity only until
      # that is cleared, after which warnings can be made fatal.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # `flutter test` runs on the Dart VM, where ByteData has the uint64
      # accessors dart2js lacks — so a VM-only suite cannot see the transport
      # break on web, and once didn't: #48 patched the generated bindings for
      # dart2js and #53 regenerated the patch away with nothing failing, because
      # the client still negotiated triage-json. Now that FlatBuffers is the
      # default and the daemon serves this client as its embedded web UI
      # (crates/triaged/build.rs runs `flutter build web --release`), the binary
      # path has to be exercised on the platform that actually ships it.
      #
      # Scoped to the transport tests rather than the whole suite: the storage
      # and widget tests have pre-existing web failures that are unrelated to
      # this and would only make the gate noise.
      - name: Run transport tests on web (dart2js)
        run: |
          flutter test --platform chrome \
            test/triage_websocket_client_test.dart \
            test/flatbuffers_js_compat_test.dart

  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    # Headroom for a cold first build (Gradle dist + deps + any SDK/NDK pull)
    # before the Gradle cache is populated from the default branch.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: flutter/triage_client

    steps:
      - name: Checkout
        # actions/checkout@v5
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd

      - name: Set up JDK
        # actions/setup-java@v4
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          # Matches sourceCompatibility/jvmTarget in android/app/build.gradle.kts.
          java-version: "17"

      - name: Set up Flutter
        # subosito/flutter-action@v2 (matches publish.yml). cache: true caches
        # both the Flutter SDK and the pub package cache (~/.pub-cache).
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      # Caches the Gradle user home (dependencies + wrapper dists + build cache)
      # for the Gradle that `flutter build apk` shells out to. By default it only
      # writes the cache from the default branch, so PRs restore but don't
      # pollute it — main's CI run populates it after this merges.
      - name: Set up Gradle cache
        # gradle/actions/setup-gradle@v6.2.0
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Install dependencies
        run: flutter pub get

      # A release build, but signed with the debug keystore (see the release
      # signingConfig in android/app/build.gradle.kts), so the artifact installs
      # directly on any device without release-signing secrets. One universal
      # APK — download a single file from the run summary and sideload it.
      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        # actions/upload-artifact@v6 (matches publish.yml)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: triage-client-apk
          # Path is relative to the workspace root, not the job working-directory.
          path: flutter/triage_client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
