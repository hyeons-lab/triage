name: triage_client
description: "Flutter remote client for the Triage attention-routing terminal supervisor."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.3.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.40.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  web_socket_channel: ^3.0.1
  flat_buffers: ^25.9.23
  xterm: ^4.0.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.2

# Pinned to a fork of the released 4.0.0. Against the release, `lib/` differs by
# exactly one file, `src/utils/circular_buffer.dart`, carrying the fixes below
# and nothing else. The branch's other commits are tests, corrections to the
# comments on those fixes, and a dev-dependency removal; the tests and the dev
# dependency are outside `lib/`, and pub never resolves them for a non-root
# package, so they cannot reach this app either way. Verify with:
#
#   git diff v4.0.0..<ref> -- lib/
#
# rather than by commit count, which has drifted from this comment more than
# once.
#
# 1. `IndexAwareCircularBuffer.trimStart` advances the list's start without
# advancing the absolute start it measures indices from, so after `ESC[3J`
# (what `clear` emits) every surviving scrollback line reports a row too high
# by the number trimmed, while lines written afterwards report correctly.
# `BufferLine.index` is what pins our scrollback viewport (see
# TerminalScrollAnchor) and what selection anchors resolve through, so the
# effect is a viewport that jumps and a selection that reads the wrong rows
# after any clear.
#
# It is fixed upstream only in PR 225, unmerged since 2026-05-08 against a
# release that is two years old, so there is no published version to move to.
# The fork is that PR's approach: advance the absolute start, and deliberately
# do not detach the trimmed lines, because anchors still holding them guard
# access with `assert(attached)` alone and would throw in release builds where
# that assert is stripped. Retiring those anchors is left to us, in
# `terminal_scroll_anchor.dart` and the panes.
#
# 2a. `replaceWith` clears the slots it is about to reuse without detaching
# what they held, because after a trim those are lines fix 1 deliberately left
# attached. Detaching them is the release-build crash fix 1 exists to avoid.
# This also replaces a loop that dropped buffer slots on an oversized
# replacement, which indexed the list rather than the replacement and could
# reach those same lines.
#
# 2b. `replaceWith` adopted the reflowed lines through the rotated start and
# only reset that start afterwards, so it wrote them at one rotation and read
# them back at another, leaving the buffer rotated against itself. This is not
# specific to a clear: `push` rotates the array every time it evicts from a
# full scrollback, so writing past `maxLines` and then changing the width is
# enough. Every row then answers with a different row's line and reports the
# wrong index. When the reflow result is also shorter than the buffer (widening
# a window whose lines were wrapped) it leaves rows the reflow never wrote, so a
# row can hand back a cleared line or throw a null check error instead. Not in
# PR 225; it is ours, and it is also what makes the rule the guards here rely on
# ("a negative row means cleared away") hold on the resize path.
#
# Branched from the `v4.0.0` tag rather than upstream master. Master carries
# unreleased commits beyond the tag, two of them behavioural (colour rendering
# in `palette_builder.dart`, Android enter-key handling in `terminal_view.dart`),
# and taking those unreviewed alongside a scrollback fix is not a trade this
# needs to make.
#
# Pinned by commit, not by branch name: a branch ref would let a force-push or
# a new commit change the terminal emulator this app ships with no diff here.
#
# Fix 1 can be dropped once a release contains PR 225. Fix 2 has not been filed
# upstream yet, so nothing will carry it until that happens; drop the override
# only once a release contains both.
dependency_overrides:
  xterm:
    git:
      url: https://github.com/hyeons-lab/xterm.dart.git
      ref: 1ca073d34fec7f731e1523b604a82e2d45edb9a4

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

# Launcher icons. Sources of truth are the SVGs in assets/icon/; the two PNGs
# below are derived. To regenerate after editing an SVG:
#
#   cd assets/icon
#   inkscape triage_icon.svg -w 1024 -h 1024 -o /tmp/icon.png
#   inkscape triage_logo_transparent.svg -w 1024 -h 1024 -o /tmp/logo.png
#   # iOS wants a full-bleed OPAQUE square (it applies its own squircle mask):
#   magick /tmp/icon.png -background "#1A2233" -alpha remove -alpha off icon_square.png
#   # Android adaptive foreground: logo at ~88% of the layer — the generated
#   # adaptive XML insets it by a further 16%, landing the mark at ~60%.
#   magick /tmp/logo.png -trim +repage -resize 900x900 -background none \
#       -gravity center -extent 1024x1024 adaptive_fg.png
#   cd ../.. && dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_square.png"
  adaptive_icon_background: "#1A2233"
  adaptive_icon_foreground: "assets/icon/adaptive_fg.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Bundled terminal font (OFL-licensed; see fonts/OFL.txt) so the terminal
  # renders identically across macOS/Windows/Linux instead of relying on
  # system-installed fonts.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
        - asset: fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
